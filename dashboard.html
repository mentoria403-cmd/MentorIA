<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dashboard - MentorIA</title>

  <link rel="stylesheet" href="style.css">

</head>
<body class="dashboard-body">

  <header class="dashboard-header">

    <h1>MentorIA</h1>

    <button onclick="sair()">
      Sair
    </button>

  </header>

  <main class="dashboard">

    <section class="boas-vindas">

      <h2 id="mensagemUsuario">
        Olá, estudante 👋
      </h2>

      <p>
        Organize sua rotina e acompanhe seus estudos.
      </p>

    </section>
    <!-- PROGRESSO -->

<section class="dashboard-card">

  <h3>Meu Progresso</h3>

  <div class="progresso-container">

    <div id="barraProgresso"></div>

  </div>

  <p id="textoProgresso">
    0% concluído
  </p>

</section>

    <!-- TAREFAS -->

    <section class="dashboard-card">

      <h3>Minhas Tarefas</h3>

      <div class="input-area">

        <input
          type="text"
          id="tarefaInput"
          placeholder="Digite uma tarefa"
        >

        <button onclick="adicionarTarefa()">
          Adicionar
        </button>

      </div>

      <ul id="listaTarefas"></ul>

    </section>

    <!-- METAS -->

    <section class="dashboard-card">

      <h3>Metas de Estudo</h3>

      <div class="input-area">

        <input
          type="text"
          id="metaInput"
          placeholder="Digite uma meta"
        >

        <button onclick="adicionarMeta()">
          Adicionar
        </button>

      </div>

      <ul id="listaMetas"></ul>

    </section>
    <!-- CRONOGRAMA -->

<section class="dashboard-card">

  <h3>Cronograma de Estudos</h3>

  <div class="cronograma-form">

    <input
      type="text"
      id="materiaInput"
      placeholder="Matéria"
    >

    <select id="diaInput">

      <option value="">
        Selecione o dia
      </option>

      <option>Segunda</option>
      <option>Terça</option>
      <option>Quarta</option>
      <option>Quinta</option>
      <option>Sexta</option>
      <option>Sábado</option>
      <option>Domingo</option>

    </select>

    <input
      type="time"
      id="horarioInput"
    >

    <button onclick="adicionarCronograma()">
      Adicionar
    </button>

  </div>

  <div id="listaCronograma"></div>

</section>

  </main>

  <script src="scriptDashboarb.js"></script>

</body>
</html>
