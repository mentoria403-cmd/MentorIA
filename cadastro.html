 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - MentorIA</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="login-box">

      <h1>Criar Conta</h1>

      <p>Cadastre-se no MentorIA</p>

      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
      >

      <input
        type="email"
        id="email"
        placeholder="Digite seu email"
      >

      <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
      >

      <input
        type="password"
        id="confirmarSenha"
        placeholder="Confirme sua senha"
      >

      <p></p><button onclick="cadastrar()">
        Cadastrar
      </button>

      <p class="cadastro">
        Já possui conta?
        <a href="login.html">Entrar</a>
      </p>

    </div>

  </div>

  <script src="scriptCadastro.js"></script>

</body>
</html>
